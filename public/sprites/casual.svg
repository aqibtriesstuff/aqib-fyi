<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 48" width="64" height="96" shape-rendering="crispEdges">
  <!-- body slight lean -->
  <rect x="10" y="28" width="12" height="14" fill="#4A3728"/>
  <!-- arms relaxed -->
  <rect x="6" y="29" width="4" height="9" fill="#4A3728"/>
  <rect x="22" y="30" width="4" height="9" fill="#4A3728"/>
  <!-- hands -->
  <rect x="5" y="37" width="5" height="4" fill="#C8956A"/>
  <rect x="22" y="38" width="5" height="4" fill="#C8956A"/>
  <!-- legs -->
  <rect x="10" y="42" width="5" height="6" fill="#2C2A27"/>
  <rect x="17" y="42" width="5" height="6" fill="#2C2A27"/>
  <!-- neck -->
  <rect x="14" y="24" width="4" height="5" fill="#C8956A"/>
  <!-- head -->
  <rect x="9" y="10" width="14" height="14" fill="#C8956A"/>
  <!-- hair with a little tuft -->
  <rect x="9" y="8" width="14" height="5" fill="#2C2A27"/>
  <rect x="8" y="10" width="2" height="6" fill="#2C2A27"/>
  <rect x="22" y="10" width="2" height="4" fill="#2C2A27"/>
  <rect x="15" y="6" width="3" height="3" fill="#2C2A27"/>
  <!-- eyes relaxed half-closed -->
  <rect x="12" y="16" width="2" height="1" fill="#2C2A27"/>
  <rect x="18" y="16" width="2" height="1" fill="#2C2A27"/>
  <!-- eyebrows relaxed -->
  <rect x="11" y="14" width="4" height="1" fill="#2C2A27"/>
  <rect x="17" y="14" width="4" height="1" fill="#2C2A27"/>
  <!-- mouth relaxed slight smile -->
  <rect x="13" y="21" width="3" height="1" fill="#2C2A27"/>
  <rect x="16" y="20" width="3" height="1" fill="#2C2A27"/>
</svg>
